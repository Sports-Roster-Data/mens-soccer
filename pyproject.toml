[project]
name = "soccer-rosters"
version = "0.2.0"
description = "Scrape and consolidate NCAA men's and women's soccer team rosters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "requests>=2.32.5",
    "tldextract>=5.3.0",
    "playwright>=1.48.0",
    "shot-scraper>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
